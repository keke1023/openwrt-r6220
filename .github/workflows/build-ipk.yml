name: Build IPK Only

# 只编译单个/一组 IPK 包，不生成固件镜像。
# 用法：Actions → Build IPK Only → Run workflow
#   - target    : 目标架构/子目标（IPK 与架构强相关，必须选对！否则装不到机器上）
#   - package   : 要编译的包名（含 luci- 前缀），默认 luci-app-ssr-plus
#   - feed_branch: helloworld 源分支，默认 master（与固件编译一致）
# 产物：Actions 的 Artifacts（ipk-<包名>-<架构>），含目标包及其全部依赖的 .ipk
#
# 说明：单包编译仍需先构建工具链（gcc/binutils/libc/内核头），这部分耗时不可省；
#       真正省掉的是「生成固件镜像」这一步。ccache + dl 缓存可大幅加速二次运行。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '目标架构/子目标（IPK 架构强相关，必须选对）'
        required: true
        default: 'mediatek/filogic'
        type: choice
        options:
          - mediatek/filogic
          - ramips/mt7621
          - ipq40xx/generic
          - ath79/nand
      package:
        description: '要编译的软件包名。普通包如 luci-app-ssr-plus；内核模块填 kmod-xxx（如 kmod-zram）'
        required: true
        default: 'luci-app-ssr-plus'
      feed_branch:
        description: 'helloworld 源分支（默认 master，与固件编译一致）'
        required: true
        default: 'master'
      source_branch:
        description: 'immortalwrt 源码分支（克隆时 -b 参数）。默认 openwrt-23.05；可填 openwrt-18.06-k5.4 等旧分支'
        required: false
        default: 'openwrt-23.05'

permissions:
  contents: read        # 仅上传 Artifact，无需写 Release

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Shanghai

jobs:
  build-ipk:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/openwrt/staging_dir/cache
      CCACHE_MAXSIZE: 5G
    steps:
      - name: 初始化（生成安全的目标标识，避免 key/名称里出现斜杠）
        id: env
        run: echo "target_key=$(echo '${{ inputs.target }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------------------
      # kmod 与普通包走完全不同的编译入口，必须提前分流：
      #   普通包：feeds install 把包软链进 package/feeds/<feed>/，再 make package/<包名>/compile
      #   kmod  ：全部定义在源码树内 package/kernel/linux/modules/*.mk 里（例如 zram 在
      #           other.mk），既没有 feeds 条目、也没有 package/<包名> 目录，
      #           `make package/kmod-zram/compile` 会直接 "No rule to make target"。
      #           正确入口是 make package/kernel/linux/compile —— 它会遍历所有
      #           KernelPackage，只编译 .config 里选中的那些。
      # ---------------------------------------------------------------------
      - name: 解析包类型（kmod 与 feeds 包走不同编译入口）
        id: pkg
        run: |
          PKG="${{ inputs.package }}"
          case "$PKG" in
            kmod-*)
              echo "kind=kmod" >> $GITHUB_OUTPUT
              echo "make_target=package/kernel/linux" >> $GITHUB_OUTPUT
              echo "==> 识别为内核模块包：走 package/kernel/linux 编译入口" ;;
            *)
              echo "kind=pkg" >> $GITHUB_OUTPUT
              echo "make_target=package/$PKG" >> $GITHUB_OUTPUT
              echo "==> 识别为普通软件包：走 package/$PKG 编译入口" ;;
          esac

      - name: 清理磁盘空间（避免 runner 空间不足）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -hT $PWD

      # apt 加固：裸 apt-get 没有超时会一路挂到 job 的 6 小时上限（run 41471719379 实测
      # 卡此步 90 分钟无输出，而正常基线只要 72 秒），故统一套 timeout + 重试 + IPv4。
      - name: 安装编译依赖
        timeout-minutes: 40
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
          PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev jq python3-pyelftools"
          sudo timeout 300 apt-get $APT_OPTS update || echo "!! apt-get update 超时或部分源失败，仍继续尝试安装"
          ok=0
          for i in 1 2 3; do
            echo "--- 编译依赖安装：第 $i 次尝试（上限 700s）---"
            if sudo timeout 700 apt-get $APT_OPTS install -y $PKGS; then ok=1; break; fi
            echo "!! 第 $i 次失败或超时，20s 后重试"
            sleep 20
            sudo timeout 120 apt-get $APT_OPTS update || true
          done
          if [ "$ok" != "1" ]; then
            echo "!! 编译依赖安装失败（3 次重试均未成功），提前报错退出"
            exit 1
          fi
          echo "OK：编译依赖安装完成"

      - name: 克隆 immortalwrt 源码（分支由 source_branch 输入决定，默认 openwrt-23.05）
        run: git clone --depth 1 $REPO_URL -b "${{ inputs.source_branch || env.REPO_BRANCH }}" openwrt

      - name: 添加 helloworld 源（luci-app-ssr-plus 来源）
        env:
          SRC_BRANCH: ${{ inputs.source_branch || env.REPO_BRANCH }}
        run: |
          cd openwrt
          case "$SRC_BRANCH" in
            openwrt-18.06-k*) : ;;                         # 18.06 + 新内核(k5.4)：放行 helloworld
            openwrt-18.06) echo "==> 源码分支为旧版($SRC_BRANCH)，跳过 helloworld（不兼容）"; exit 0 ;;
          esac
          echo "src-git helloworld https://github.com/fw876/helloworld.git;${{ inputs.feed_branch }}" >> feeds.conf.default

      - name: 更新并安装 feeds（仅装目标包及其依赖）
        run: |
          cd openwrt
          # feeds update -a 保留：目标包可能依赖 feeds 里的库（如 xray-core 依赖的 golang 源）
          ./scripts/feeds update -a
          if [ "${{ steps.pkg.outputs.kind }}" = "kmod" ]; then
            echo "==> kmod 在源码树内（package/kernel/linux/modules/*.mk），跳过 feeds install"
          else
            ./scripts/feeds install ${{ inputs.package }}
          fi

      # ---------------------------------------------------------------------
      # 缓存 1：dl 源码包（与固件编译共享同一份 openwrt-dl 缓存，最大提速）
      # ---------------------------------------------------------------------
      - name: 缓存 dl 目录（源码包）
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl
          restore-keys: |
            openwrt-dl

      # ---------------------------------------------------------------------
      # 缓存 2：ccache 编译缓存（按架构共享，二次运行大幅加速）
      # ---------------------------------------------------------------------
      - name: 缓存 ccache（按架构）
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir/cache
          key: openwrt-ipk-ccache-${{ steps.env.outputs.target_key }}
          restore-keys: |
            openwrt-ipk-ccache-${{ steps.env.outputs.target_key }}

      - name: 生成最小配置（仅选目标架构 + 目标包）
        run: |
          cd openwrt
          # 必须同时写父级 target 与 subtarget 两行符号！
          # 只写 CONFIG_TARGET_xxx_yyy=y（缺 CONFIG_TARGET_xxx=y）时，kconfig 会因
          # 依赖不满足丢弃该符号，defconfig 回退到默认 x86/64（已实际踩坑：
          # 全程跑成 staging_dir/target-x86_64_musl 导致产物架构错误）。
          PARENT=$(echo '${{ inputs.target }}' | cut -d/ -f1)
          SUB=$(echo '${{ inputs.target }}' | cut -d/ -f2)
          if [ "${{ steps.pkg.outputs.kind }}" = "kmod" ]; then
            # kmod 只需要目标架构 + 这一个内核模块；压缩算法等依赖由包自身的
            # select（zram 默认 ZRAM_DEF_COMP_LZORLE → kmod-lib-lzo）自动带入。
            cat > .config <<EOF
          CONFIG_TARGET_${PARENT}=y
          CONFIG_TARGET_${PARENT}_${SUB}=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_${{ inputs.package }}=y
          EOF
          else
            cat > .config <<EOF
          CONFIG_TARGET_${PARENT}=y
          CONFIG_TARGET_${PARENT}_${SUB}=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_${{ inputs.package }}=y
          # ssr-plus 在 aarch64 默认拉 Rust 版 shadowsocks，关掉以免编译失败（与固件 config 一致）
          CONFIG_INCLUDE_Shadowsocks_Rust_Client=n
          CONFIG_INCLUDE_Shadowsocks_Rust_Server=n
          CONFIG_INCLUDE_MosDNS=n
          CONFIG_INCLUDE_Shadowsocks_Libev_Client=y
          EOF
          fi
          make defconfig
          # 防御校验：目标架构必须真正生效，否则立即失败（比编到最后才发现架构错了强得多）
          if ! grep -q "^CONFIG_TARGET_${PARENT}_${SUB}=y" .config; then
            echo "::error::目标 ${PARENT}/${SUB} 未生效，defconfig 后实际 target 如下："
            grep '^CONFIG_TARGET_.*=y' .config | head -10
            exit 1
          fi
          echo "==> 生效的目标架构："
          grep '^CONFIG_TARGET_.*=y' .config | head -5

      - name: 下载依赖源码包
        run: |
          cd openwrt
          make download -j8

      # ---------------------------------------------------------------------
      # 关键：单包编译（make package/X/compile）不会自动构建交叉工具链！
      # package/X/compile 的依赖链会直接编到 package/libs/toolchain（打包 libc），
      # 它要从 staging_dir/toolchain-*/lib/ 拷 ld-musl-*.so*，而工具链没建过 → cp 报错。
      # 必须先显式构建 tools + toolchain（首次较慢，之后 ccache/dl 缓存加速）。
      - name: 构建工具链（单包编译前置，必须显式构建）
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install -j1
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      # ---------------------------------------------------------------------
      # kmod 能不能产出 ipk，取决于它声明的 KCONFIG 是否真被写进目标内核配置。
      # ⚠️ 踩过的坑：内核 .config 并不是 make target/linux/prepare 生成的，
      #    prepare 只做解包 + 打补丁；.config 要等 target/linux/compile 里跑
      #    oldconfig 才出现。所以「prepare 完就查 .config」必然找不到 → 误报失败。
      # 改成两段式：
      #   ① 编译前（秒级）：确认 kmod 已在顶层 .config 选中 + 能从 modules/*.mk
      #      解析出它声明的 KCONFIG，把符号清单落到 /tmp/kmod-syms.txt；
      #   ② 内核编译后：再拿真实内核 .config 逐个校验 =m，缺了才真失败。
      # ---------------------------------------------------------------------
      - name: 预检 kmod 定义与符号清单（kmod 专用，秒级）
        if: steps.pkg.outputs.kind == 'kmod'
        run: |
          cd openwrt
          PKG="${{ inputs.package }}"
          # 已选中该 kmod，其 KCONFIG 才会被注入内核 .config
          grep -qE "^CONFIG_PACKAGE_${PKG}=y$" .config \
            || { echo "!! 顶层 .config 里没有 CONFIG_PACKAGE_${PKG}=y"; exit 1; }
          echo "OK：顶层 .config 已选中 ${PKG}"
          python3 - "${PKG#kmod-}" <<'PYEOF'
          import glob, re, sys
          name = sys.argv[1]
          hit = None
          for p in sorted(glob.glob("package/kernel/linux/modules/*.mk")):
              s = open(p, encoding="utf-8").read()
              m = re.search(r"^define KernelPackage/%s\s*$" % re.escape(name), s, re.M)
              if not m:
                  continue
              blk = s[m.end():]
              end = blk.find("\nendef")
              if end >= 0:
                  blk = blk[:end]
              kcs = []
              for line in blk.split("\n"):
                  if "=" in line:      # CONFIG_X=n 之类是强制值，不作为「必须 =m」的符号
                      continue
                  for k in re.findall(r"CONFIG_[A-Z0-9_]+", line):
                      if k not in kcs:
                          kcs.append(k)
              hit = (p, kcs)
              break
          if hit is None:
              print("!! modules/*.mk 里找不到 KernelPackage/%s" % name)
              sys.exit(1)
          p, kcs = hit
          if not kcs:
              print("!! KernelPackage/%s 未声明任何 KCONFIG 符号" % name)
              sys.exit(1)
          print("定义位置：%s" % p)
          print("应置 m 的内核符号：%s" % " ".join(kcs))
          with open("/tmp/kmod-syms.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(kcs) + "\n")
          PYEOF

      # ---------------------------------------------------------------------
      # 关键：内核同样不会自动编译！
      # defconfig 默认会选中 gpio-button-hotplug / mt76 wifi 等 kmod，它们的 .built 依赖
      # build_dir/.../linux-<ver>/.config + Module.symvers，而 make package/X/compile
      # 不会自动 prepare/编译内核 → 报 "No rule to make target .../linux-X/.config"。
      # 必须先 make target/linux/compile（生成 .config + 编译 vmlinux/modules）。
      # 首次较慢（20-40 分钟），靠 ccache 缓存之后大幅加速。
      - name: 编译内核（提供 .config + Module.symvers，给 kmod 包用）
        run: |
          cd openwrt
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s

      # 内核编完才存在 .config，这里做真实校验；缺符号说明该 kmod 的 KCONFIG
      # 没被注入（被 target config 的 is not set 顶掉之类），直接失败别浪费时间。
      - name: 校验内核符号已置 m（内核编译后）
        if: steps.pkg.outputs.kind == 'kmod'
        run: |
          cd openwrt
          KC=$(ls -1 build_dir/target-*/linux-*/linux-*/.config 2>/dev/null | head -1)
          [ -n "$KC" ] || { echo "!! 内核 .config 不存在，内核编译没真正完成"; exit 1; }
          echo "内核配置：$KC"
          [ -s /tmp/kmod-syms.txt ] || { echo "!! /tmp/kmod-syms.txt 缺失或为空（预检步骤没跑到）"; exit 1; }
          MISS=0
          for k in $(cat /tmp/kmod-syms.txt); do
            v=$(sed -n "s/^${k}=\([my]\)$/\1/p" "$KC" | head -1)
            if [ "$v" = "m" ]; then
              echo "  ${k} -> m"
            elif [ "$v" = "y" ]; then
              echo "  ${k} -> y（已编进内核，kmod 包会是空的，需改为模块）"
              MISS=1
            else
              echo "  ${k} -> 缺失"
              MISS=1
            fi
          done
          [ "$MISS" -eq 0 ] || { echo "!! 有符号未置 m，kmod .ko 不会产出"; exit 1; }
          echo "OK：内核符号齐备，kmod 可以打包出 ipk"

      - name: 编译目标包（仅编该包及其依赖，不生成固件镜像）
        id: compile
        run: |
          cd openwrt
          TARGET_DIR="${{ steps.pkg.outputs.make_target }}"
          echo "==> make ${TARGET_DIR}/compile"
          # kmod 走 package/kernel/linux：会把 .config 里所有选中的内核模块都打包一遍
          # （内核本身已在上一步编好，这一步主要是 strip + 打 ipk，速度很快）
          make ${TARGET_DIR}/compile -j$(nproc) V=s || make ${TARGET_DIR}/compile -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      # ⚠️ 内核模块的 ipk 不在 bin/packages/，而在 bin/targets/<t>/<s>/packages/
      #    （package/kernel/linux 走 target 侧打包路径）。只打包 bin/packages
      #    会漏掉 kmod-zram 本身，只剩 feeds 编出来的固件包 —— 已踩过。
      - name: 列出产物 IPK
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          echo "=== bin/targets（内核模块与固件包）==="
          find bin/targets -path '*/packages/*' -name '*.ipk' 2>/dev/null | sort
          echo "=== bin/packages（feeds 包与依赖）==="
          find bin/packages -name '*.ipk' 2>/dev/null | sort
          echo "=== 目标包是否产出 ==="
          HIT=$(find bin/targets bin/packages -name "${{ inputs.package }}_*.ipk" 2>/dev/null || true)
          if [ -n "$HIT" ]; then
            echo "$HIT"
          else
            echo "!! 没有找到 ${{ inputs.package }}_*.ipk"
            exit 1
          fi

      - name: 上传 IPK（含依赖）
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ inputs.package }}-${{ steps.env.outputs.target_key }}
          path: |
            openwrt/bin/targets/*/*/packages/*.ipk
            openwrt/bin/packages/**/*.ipk
          retention-days: 14
