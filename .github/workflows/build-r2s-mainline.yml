name: Build R2S Mainline (r8152 driver validation)

# =============================================================================
# 目的：用 OpenWrt 官方主线（默认 v25.12.6 / kernel 6.12）编一版 NanoPi R2S，
#      验证 Linux 6.12 内树 r8152 是否解决了 RTL8153B USB 网口卡死 / 掉总线问题。
#
# 为什么要另起一条线而不复用 build.yml：
#   build.yml 是 immortalwrt 23.05（kernel 5.15.198）多机型矩阵，其 config 目录、
#   第三方 feeds、diy-part2 里的所有注入都绑定 5.15 结构；主线 25.12 已切 apk、
#   内核 6.12，混在一起只会让变量失控。验证实验要的是「最少的变量 + 最干净的基线」。
#
# 本 workflow 刻意【不】做任何驱动的额外调优：
#   不加 sg_en 调优脚本、不加 usbnic-watch 守护、不换 vendor 驱动、不注入内核补丁。
#   要看的就是「裸主线驱动自己撑不撑得住」。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'OpenWrt 源码 ref（tag 或分支），默认 v25.12.6（kernel 6.12.112）'
        required: false
        default: 'v25.12.6'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build-r2s-mainline:
    name: Build r2s (openwrt mainline)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出本仓库（拿 config-mainline/）
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          df -hT / | tail -1

      # apt 加固沿用 build.yml 的实测结论：裸 apt 可能无声卡满整个 job 上限
      - name: 安装编译依赖
        timeout-minutes: 40
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
          PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev jq python3-pyelftools"
          sudo timeout 300 apt-get $APT_OPTS update || echo "!! apt-get update 部分失败，继续"
          ok=0
          for i in 1 2 3; do
            echo "--- 依赖安装第 $i 次（上限 700s）---"
            if sudo timeout 700 apt-get $APT_OPTS install -y $PKGS; then ok=1; break; fi
            echo "!! 第 $i 次失败，20s 后重试"
            sleep 20
            sudo timeout 120 apt-get $APT_OPTS update || true
          done
          [ "$ok" = "1" ] || { echo "!! 依赖安装 3 次均失败"; exit 1; }
          echo "OK：依赖就绪"

      - name: 克隆 OpenWrt 官方主线
        run: |
          REF="${{ inputs.source_ref }}"
          echo "==> 源码：openwrt/openwrt @ $REF"
          git clone --depth 1 -b "$REF" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "==> commit: $(git log -1 --format='%H %s')"
          echo "==> 内核版本：$(grep -E '^LINUX_KERNEL_VERSION' include/kernel-version.mk)"

      # 早失败：设备被移除 / target 改名会让后面白跑一小时
      - name: 预检 target 与设备定义
        run: |
          cd openwrt
          echo "--- target/linux 下的架构 ---"
          ls -1 target/linux/
          test -d target/linux/rockchip/armv8 || { echo "!! rockchip/armv8 不存在"; exit 1; }
          echo "--- rockchip 设备定义 ---"
          ls -1 target/linux/rockchip/image/
          grep -rn "nanopi-r2s" target/linux/rockchip/image/*.mk | head -5 \
            || { echo "!! 未找到 nanopi-r2s 设备定义"; exit 1; }
          grep -rn "friendlyarm,nanopi-r2s" target/linux/rockchip/ | head -3 || true

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------------------------
      # luci-app-ssr-plus：按 helloworld 官方 README 的 Method 1，直接 clone 到
      # package/helloworld（package/ 优先级高于 feeds/，100% 确定收录 helloworld 版）。
      #
      # 两个必做的收尾动作：
      #   1) 剥离 shadowsocks-rust —— aarch64 下 LUCI_DEPENDS 会通过条件依赖把
      #      Rust 工具链拽进来（rustc 1.88，编译极慢且易失败），而 xray 已覆盖
      #      日常主力场景。直接删掉所有含 shadowsocks-rust 的依赖行。
      #   2) 删除官方 packages 源里与 helloworld 同名的包 —— 25.12 的
      #      net/{xray-core,v2ray-core,v2raya,microsocks} 全部与 helloworld 重名，
      #      留着会构成 duplicate package，最终装进去的是哪一份不可控。
      #      ssr-plus 要的是 helloworld 那套（版本串与 gen_config.lua 逻辑配套）。
      # ---------------------------------------------------------------------
      - name: 添加 helloworld 源（luci-app-ssr-plus）
        run: |
          cd openwrt
          HELLO_SHA=2abdc9aa9e19607774dc9789709212b70b8607c6
          rm -rf package/helloworld
          git clone https://github.com/fw876/helloworld.git package/helloworld
          git -C package/helloworld checkout -q "$HELLO_SHA"
          echo "==> helloworld @ $(git -C package/helloworld log -1 --format='%h %ad %s' --date=short)"
          test -d package/helloworld/luci-app-ssr-plus || { echo "!! clone 后没有 luci-app-ssr-plus"; exit 1; }
          grep -m1 '^PKG_VERSION:=' package/helloworld/luci-app-ssr-plus/Makefile
          grep -m1 '^PKG_VERSION:=' package/helloworld/xray-core/Makefile

          SSRP_MK=package/helloworld/luci-app-ssr-plus/Makefile
          sed -i '/shadowsocks-rust/d' "$SSRP_MK"
          if grep -q 'shadowsocks-rust' "$SSRP_MK"; then
            echo "!! shadowsocks-rust 未剥离干净"; exit 1
          fi
          echo "OK：shadowsocks-rust 已剥离"

          for p in xray-core v2ray-core v2raya microsocks; do
            if [ -d "package/feeds/packages/$p" ]; then
              rm -rf "package/feeds/packages/$p"
              echo "已移除重名 feeds 包：$p"
            fi
          done
          echo "==> package/helloworld 内包目录："
          ls -1 package/helloworld | tr '\n' ' '; echo

      # ---------------------------------------------------------------------
      # LAN/WAN 对调：保持与 23.05 正式版一致的接线习惯
      #
      # 友善官方定义：eth0 = 板载原生 GMAC（WAN），eth1 = USB3 转网口（LAN）
      # 但本仓库正式固件在 scripts/diy-part2.sh 里已把 R2S 改成 lan=eth0 / wan=eth1
      # （即 USB 网口做 WAN），用户接线基于此。
      # 本 workflow 不带 diy-part2.sh，若不补这一步，刷完 LAN/WAN 会与现状相反。
      # ---------------------------------------------------------------------
      - name: 对调 R2S 的 LAN/WAN（与正式版一致）
        run: |
          cd openwrt
          SCRIPT="${{ github.workspace }}/scripts/diy-r2s-lanwan.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "!! 脚本不存在：$SCRIPT"
            echo "   该文件必须与本 workflow 一起提交在仓库里（曾漏推导致本步骤失败）"
            exit 1
          fi
          N2=target/linux/rockchip/armv8/base-files/etc/board.d/02_network
          test -f "$N2" || { echo "!! 找不到 02_network"; exit 1; }
          echo "--- 改前 ---"
          grep -n "nanopi-r2s" "$N2" || true
          python3 "$SCRIPT" "$N2"
          echo "--- 改后 ---"
          grep -n "nanopi-r2s" "$N2"
          # r2s 独立分支必须落在 rockchip_setup_interfaces 内，且 lan=eth0 / wan=eth1
          grep -A1 "friendlyarm,nanopi-r2s)" "$N2" \
            | grep -q "ucidef_set_interfaces_lan_wan 'eth0' 'eth1'" \
            || { echo "!! LAN/WAN 对调未生效"; exit 1; }
          # 共享列表里的 r2s 行必须已摘掉：改前 2 处（interfaces + macs），改后只剩 macs 1 处
          n=$(grep -c "friendlyarm,nanopi-r2s|" "$N2" || true)
          [ "$n" = "1" ] || { echo "!! 共享行数量异常（$n，期望 1，只剩 setup_macs 那处）"; exit 1; }
          # r2s-plus 绝不能被误删（宽松正则的历史坑）
          grep -q "friendlyarm,nanopi-r2s-plus|" "$N2" \
            || { echo "!! r2s-plus 的网口配置被误删"; exit 1; }
          echo "OK：r2s lan=eth0(原生) wan=eth1(USB)；r2s-plus 与 macs 块未受影响"

      - name: 应用验证版 config
        run: |
          cd openwrt
          cp ../config-mainline/friendlyarm_nanopi-r2s.config .config
          make defconfig 2>&1 | tee /tmp/defconfig.log
          echo "==================== 重名包检查 ===================="
          if grep -iE "duplicate package|is defined twice" /tmp/defconfig.log; then
            echo "!! 存在重名包定义（feeds 与 helloworld 冲突）"; exit 1
          fi
          echo "OK：无重名包"
          echo "==================== target ===================="
          grep -E "^CONFIG_TARGET_rockchip" .config
          grep -E "CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r2s" .config || {
            echo "!! 设备未被选中"; exit 1; }
          echo "==================== 驱动（验证目标）===================="
          grep -E "^CONFIG_PACKAGE_kmod-usb-net-rtl8152=" .config || {
            echo "!! 内树 r8152 未选中"; exit 1; }
          if grep -qE "^CONFIG_PACKAGE_kmod-usb-net-rtl8152-vendor=y" .config; then
            echo "!! 意外选中 vendor 驱动，验证目标被污染"; exit 1
          fi
          grep -E "^CONFIG_PACKAGE_ethtool=" .config
          echo "==================== ssr-plus ===================="
          grep -E "^CONFIG_PACKAGE_luci-app-ssr-plus" .config
          grep -qE "^CONFIG_PACKAGE_luci-app-ssr-plus=y" .config || {
            echo "!! ssr-plus 未被选中"; exit 1; }
          grep -qE "^CONFIG_PACKAGE_luci-compat=y" .config || {
            echo "!! luci-compat 未选中 —— CBI 会缺失，ssr-plus 页面全废"; exit 1; }
          grep -qE "^CONFIG_PACKAGE_luci-lua-runtime=y" .config || {
            echo "!! luci-lua-runtime 未选中"; exit 1; }
          grep -qE "^CONFIG_PACKAGE_xray-core=y" .config || {
            echo "!! xray-core 未选中"; exit 1; }
          grep -qE "^CONFIG_PACKAGE_luci-app-ssr-plus_Nftables_Transparent_Proxy=y" .config || {
            echo "!! 透明代理后端不是 nftables（25.12 是 firewall4，必须 nft）"; exit 1; }
          if grep -qE "^CONFIG_PACKAGE_shadowsocks-rust" .config; then
            echo "!! 意外引入 shadowsocks-rust（Rust 工具链）"; exit 1
          fi
          echo "OK：ssr-plus + xray + luci-compat 齐备，透明代理走 nftables"
          echo "==================== 内核 ===================="
          grep -E "^CONFIG_LINUX_6" .config || true


      - name: 下载源码包
        timeout-minutes: 60
        run: |
          cd openwrt
          make download -j8 V=s || make download -j1 V=s || echo "!! 部分下载失败，交给编译阶段重试"

      - name: 编译
        id: compile
        timeout-minutes: 300
        run: |
          cd openwrt
          set -o pipefail
          if make -j$(nproc) V=s 2>&1 | tail -200; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "OK：编译成功"
          else
            echo "!! -j 并行编译失败，转单线程定位"
            echo "status=failed" >> $GITHUB_OUTPUT
            make -j1 V=s 2>&1 | tail -200 || true
            exit 1
          fi

      # 验证的核心：确认编译用的 r8152.c 真的带主线那组健壮性修复
      - name: 校验内树 r8152 源码含主线修复
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          F=$(find build_dir -path "*/drivers/net/usb/r8152.c" 2>/dev/null | head -1)
          echo "r8152.c 路径: $F"
          [ -n "$F" ] || { echo "!! 找不到编译用的 r8152.c"; exit 1; }
          for sym in REGISTER_ACCESS_MAX_RESETS rtl_set_inaccessible r8152_control_msg netif_trans_update; do
            n=$(grep -c "$sym" "$F" || true)
            echo "  $sym : $n 处"
            [ "$n" -gt 0 ] || { echo "!! 缺少主线修复符号 $sym"; exit 1; }
          done
          echo "OK：主线健壮性修复全部存在"

      - name: 校验产物与 manifest
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          echo "--- 产物 ---"
          ls -lh bin/targets/rockchip/armv8/
          M=$(ls bin/targets/rockchip/armv8/*.manifest | head -1)
          echo "--- manifest 中 r8152 / usb-net / ethtool ---"
          grep -E "r8152|usb-net|ethtool" "$M" || true
          grep -q "kmod-usb-net-rtl8152" "$M" || { echo "!! manifest 缺内树 r8152"; exit 1; }
          if grep -q "kmod-usb-net-rtl8152-vendor" "$M"; then
            echo "!! manifest 出现了 vendor 包"; exit 1
          fi
          echo "--- manifest 中 ssr-plus 相关 ---"
          grep -iE "ssr-plus|xray|luci-compat|lua-runtime|dnsmasq" "$M" || true
          for p in luci-app-ssr-plus xray-core luci-compat luci-lua-runtime dnsmasq-full; do
            if ! grep -q "^$p " "$M"; then
              echo "!! manifest 缺 $p"; exit 1
            fi
          done
          if grep -q "^shadowsocks-rust" "$M"; then
            echo "!! manifest 出现 shadowsocks-rust（Rust 未剥离）"; exit 1
          fi
          echo "OK：ssr-plus 全家与内树 r8152 同时就位，无 Rust、无 vendor"
          echo "--- 内核版本 ---"
          grep -E "KERNEL" bin/targets/rockchip/armv8/profiles.json | head -3 || true

      - name: 整理固件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/rockchip/armv8
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 生成标签
        id: tag
        if: steps.compile.outputs.status == 'success'
        run: echo "release_tag=r2s-mainline-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body: |
            NanoPi R2S —— OpenWrt 官方主线 ${{ inputs.source_ref }}（kernel 6.12）验证版

            验证目标：Linux 6.12 内树 r8152 是否解决 RTL8153B USB 网口卡死 / 掉总线。
            内树驱动，未做任何 offload 调优，未加守护脚本。

            刷机后验收：
            - `uname -r`（期望 6.12.x）
            - `ethtool -i eth1 | grep version`（期望内核内树驱动，非 v2.20.1）
            - `logread | grep -c "Tx timeout"`（期望 0）

            已包含 luci-app-ssr-plus（fw876/helloworld master）+ xray-core，
            透明代理走 nftables；另装 luci-compat（Lua CBI 运行时，缺它 ssr-plus 页面全废）。
            未装 shadowsocks-rust（已剥离）。LAN/WAN 已对调：lan=eth0(原生) / wan=eth1(USB)，
            与 23.05 正式版一致。刷完可用下面两条确认 ssr-plus 与网口：
            - `ls /usr/lib/lua/luci/cbi.lua`
            - `ubus call network.interface.wan status | grep device`（期望 eth1）
          files: ${{ env.FIRMWARE }}/*

      - name: 上传 Artifact（失败也留半成品排错）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2s-mainline-${{ inputs.source_ref }}
          path: openwrt/bin/targets/**/*
          retention-days: 7
