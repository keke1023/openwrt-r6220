name: Build OpenWrt (Multi-device)

on:
  workflow_dispatch:        # 手动在 Actions 页面点 "Run workflow" 触发
#  schedule:
#    - cron: 0 20 * * 5      # 每周五 20:00 UTC 自动编译（取消注释即启用）

permissions:
  contents: write        # 允许上传 Release

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt   # 主源码：immortalwrt（自带 luci-app-ngrokc / ngrokc / luci-app-frpc）
  REPO_BRANCH: openwrt-23.05
  DIY_P1_SH: scripts/diy-part1.sh     # 更新 feeds 之前执行：添加第三方源
  DIY_P2_SH: scripts/diy-part2.sh     # 编译之前执行：改默认管理 IP 等
  TZ: Asia/Shanghai

# ---------------------------------------------------------------------------
# prepare：扫描 config/ 下所有 *.config，生成 {config, arch} 机型矩阵
# 新增机型 = 往 config/ 丢一个 xxx.config，无需改动本文件
# arch 字段用于让同架构机型（如多台 ramips）共享同一份 ccache 缓存
# ---------------------------------------------------------------------------
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          echo "扫描 config/ 下的机型配置："
          ls -1 config/*.config
          items=()
          for f in config/*.config; do
            b=$(basename "$f")
            arch=$(grep -oE 'CONFIG_TARGET_(ramips|mediatek|ipq40xx|ath79|rockchip|bcm27xx|ipq806x|sunxi)=y' "$f" | head -1 | sed -E 's/CONFIG_TARGET_([a-z0-9]+)=y/\1/')
            items+=("{\"config\":\"$b\",\"arch\":\"${arch:-unknown}\"}")
          done
          json=$(printf '%s\n' "${items[@]}" | jq -s -c '.')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "本次编译机型：$json"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false          # 一个机型失败不影响其他机型继续
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/openwrt/staging_dir/cache
      CCACHE_MAXSIZE: 5G        # 单架构 ccache 上限；多架构累加请注意仓库 10GB 总限额
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间（避免 runner 空间不足）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -hT $PWD

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils \
            bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex \
            gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev \
            libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xmlto xxd zlib1g-dev jq

      - name: 克隆源码
        run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      # ---------------------------------------------------------------------
      # 删除过时的 ipq40xx 内核补丁 401（避免打补丁阶段失败）
      # 该补丁意图注释掉 sdhci-msm 的自定义时钟函数、改用通用 sdhci_set_clock，
      # 但其上下文基于旧版内核，与当前 5.15.198 的 sdhci-msm.c 对不上（Hunk FAILED），
      # 且 5.15.198 中 .set_clock 仍引用 sdhci_msm_set_clock（非死代码），
      # 因此直接删除该补丁，保留内核原生时钟处理函数即可正常编译。
      # 仅 ipq40xx 存在此文件，rm -f 对其它架构为无操作。
      - name: 移除过时的 ipq40xx 内核补丁 401
        run: rm -f openwrt/target/linux/ipq40xx/patches-5.15/401-mmc-sdhci-msm-comment-unused-sdhci_msm_set_clock.patch

      # ---------------------------------------------------------------------
      # 缓存 1：dl 源码包（所有机型/架构共享，架构无关，最大提速收益）
      # 固定 key 让跨运行、跨机型都能复用；并发写入由 GitHub 自动处理（后者 skip）
      # ---------------------------------------------------------------------
      - name: 缓存 dl 目录（源码包）
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl
          restore-keys: |
            openwrt-dl

      # ---------------------------------------------------------------------
      # 缓存 2：ccache 编译缓存（按架构共享，同架构机型复用工具链与公共包）
      # ---------------------------------------------------------------------
      - name: 缓存 ccache（按架构）
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir/cache
          key: openwrt-ccache-${{ matrix.arch }}
          restore-keys: |
            openwrt-ccache-${{ matrix.arch }}

      - name: 执行 DIY-P1（添加自定义源）
        run: |
          cd openwrt
          chmod +x ../$DIY_P1_SH
          bash ../$DIY_P1_SH

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 DIY-P2（修改默认设置）
        run: |
          cd openwrt
          chmod +x ../$DIY_P2_SH
          bash ../$DIY_P2_SH

      - name: 加载 ${{ matrix.config }} 并生成默认配置
        run: |
          cd openwrt
          cp ../config/${{ matrix.config }} .config
          echo 'CONFIG_CCACHE=y' >> .config   # 启用 ccache，配合上面的 ccache 缓存
          make defconfig

      - name: 下载依赖源码包（先下完再编译，降低超时风险；已缓存的包会自动跳过）
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 生成发布标签（按机型名区分）
        id: tag
        if: steps.compile.outputs.status == 'success'
        run: |
          device=$(echo "${{ matrix.config }}" | sed 's/\.config$//')
          echo "release_tag=${device}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: ${{ env.FIRMWARE }}/*

      - name: 上传 Artifact（编译失败时也可拿到半成品排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.config }}
          path: openwrt/bin/targets/**/*
          retention-days: 7
