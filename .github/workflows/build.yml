name: Build OpenWrt (Multi-device)

on:
  workflow_dispatch:        # 手动在 Actions 页面点 "Run workflow" 触发
    inputs:
      targets:
        description: '只编译指定机型：逗号分隔的 config 基名，模糊匹配。留空=编译全部(仍跳过ramips)。示例：dw33d,rax3000m'
        required: false
        default: ''
      source_branch:
        description: 'immortalwrt 源码分支（克隆时 -b 参数）。默认 openwrt-23.05；可填 openwrt-18.06-k5.4 等旧分支'
        required: false
        default: 'openwrt-23.05'
#  push:
#    branches: [master]      # 如需 push 自动触发编译，取消注释这两行即可
#  schedule:
#    - cron: 0 20 * * 5      # 每周五 20:00 UTC 自动编译（取消注释即启用）

permissions:
  contents: write        # 允许上传 Release

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt   # 主源码：immortalwrt（自带 luci-app-ngrokc / ngrokc / luci-app-frpc）
  REPO_BRANCH: openwrt-23.05
  DIY_P1_SH: scripts/diy-part1.sh     # 更新 feeds 之前执行：添加第三方源
  DIY_GOLANG_SH: scripts/diy-golang.sh # feeds update 之后、install 之前：升级 Golang 工具链（16MB 机型 Go 1.22 编 xray v1.8.24；23.05/master Go 1.26 编最新 xray）
  DIY_P2_SH: scripts/diy-part2.sh     # 编译之前执行：改默认管理 IP 等
  TZ: Asia/Shanghai

# ---------------------------------------------------------------------------
# prepare：扫描机型配置目录（config/ 或 config-18.06/，按 source_branch 自动选），
#          生成 {config, arch, cfgdir} 机型矩阵
# 新增 23.05 机型 = 往 config/ 丢一个 xxx.config；新增 18.06 机型 = 往 config-18.06/ 丢 xxx.config
# 无需改动本文件。arch 字段用于让同架构机型（如多台 ramips）共享同一份 ccache 缓存
# cfgdir 字段记录该配置所在目录，build 步骤据此从正确目录加载 .config
# ---------------------------------------------------------------------------
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          # 分支隔离：按所选源码分支选择机型配置目录，避免 18.06 等旧分支的 config 污染 23.05
          SRC="${{ inputs.source_branch || env.REPO_BRANCH }}"
          case "$SRC" in
            openwrt-18.06*|18.06-k*) CFG_DIR="config-18.06" ;;
            *) CFG_DIR="config" ;;
          esac
          echo "源码分支：$SRC => 机型配置目录：$CFG_DIR"
          ls -1 "$CFG_DIR"/*.config
          items=()
          # 本次要编译的机型关键字（逗号分隔，模糊匹配）；留空=全部(仍跳过 ramips)
          TARGETS="${{ github.event.inputs.targets }}"
          for f in "$CFG_DIR"/*.config; do
            b=$(basename "$f")
            name=${b%.config}
            arch=$(grep -oE 'CONFIG_TARGET_(ramips|mediatek|ipq40xx|ath79|rockchip|bcm27xx|ipq806x|sunxi)=y' "$f" | head -1 | sed -E 's/CONFIG_TARGET_([a-z0-9]+)=y/\1/')
            # 临时跳过 ramips(mt7621) 机型：删除/注释下一行即可恢复 mt7621 编译
            # [ "$arch" = "ramips" ] && continue
            # 若指定了 targets，仅保留基名包含任一关键字的机型
            if [ -n "$TARGETS" ]; then
              hit=0
              IFS=',' read -ra KW <<< "$TARGETS"
              for kw in "${KW[@]}"; do
                kw=$(echo "$kw" | tr -d '[:space:]')
                [ -z "$kw" ] && continue
                if echo "$name" | grep -qiF -- "$kw"; then hit=1; break; fi
              done
              [ "$hit" -eq 0 ] && continue
            fi
            items+=("{\"config\":\"$b\",\"arch\":\"${arch:-unknown}\",\"cfgdir\":\"$CFG_DIR\"}")
          done
          json=$(printf '%s\n' "${items[@]}" | jq -s -c '.')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "本次编译机型：$json"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    # 跳过 ramips(mt7621) 架构：在下方 prepare 扫描阶段直接不生成 ramips 机型矩阵项，
    # 本 job 因此不会为 ramips 创建（比 matrix.exclude / job 级 if(matrix.*) 都可靠——
    # 动态 include 矩阵下 exclude 不生效；job 级 if 也不能引用 matrix 上下文）。
    # 想恢复 mt7621 编译：删除 prepare 循环里的 `[ "$arch" = "ramips" ] && continue` 一行即可。
    strategy:
      fail-fast: false          # 一个机型失败不影响其他机型继续
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/openwrt/staging_dir/cache
      CCACHE_MAXSIZE: 5G        # 单架构 ccache 上限；多架构累加请注意仓库 10GB 总限额
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间（避免 runner 空间不足）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -hT $PWD

      # apt 加固（血泪）：原来的裸 apt-get 没有任何超时，只要某个源/某个大包卡住，
      # 这一步就会一路挂到 job 的 6 小时上限，而且日志里一行输出都没有，完全无法诊断。
      # 实测：run 41471719379（2026-11-02）在 ubuntu-22.04 上卡此步 90 分钟无进展，
      # 而 run 41289510808 同样的包只用了 72 秒 —— 正常基线就是 1~3 分钟。
      # 现在改成：每个 apt 调用都套 timeout + 强制 IPv4 + 重试 3 次，失败立即退出。
      - name: 安装编译依赖
        timeout-minutes: 40
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true"
          PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev jq python3-pyelftools"
          sudo timeout 300 apt-get $APT_OPTS update || echo "!! apt-get update 超时或部分源失败，仍继续尝试安装"
          ok=0
          for i in 1 2 3; do
            echo "--- 编译依赖安装：第 $i 次尝试（上限 700s）---"
            if sudo timeout 700 apt-get $APT_OPTS install -y $PKGS; then ok=1; break; fi
            echo "!! 第 $i 次失败或超时，20s 后重试"
            sleep 20
            sudo timeout 120 apt-get $APT_OPTS update || true
          done
          if [ "$ok" != "1" ]; then
            echo "!! 编译依赖安装失败（3 次重试均未成功），提前报错退出，不再空挂到 6 小时上限"
            exit 1
          fi
          echo "OK：编译依赖安装完成"

      - name: 克隆源码（分支由 source_branch 输入决定，默认 openwrt-23.05）
        run: git clone --depth 1 $REPO_URL -b "${{ inputs.source_branch || env.REPO_BRANCH }}" openwrt

      # ---------------------------------------------------------------------
      # 删除过时的 ipq40xx 内核补丁 401（避免打补丁阶段失败）
      # 该补丁意图注释掉 sdhci-msm 的自定义时钟函数、改用通用 sdhci_set_clock，
      # 但其上下文基于旧版内核，与当前 5.15.198 的 sdhci-msm.c 对不上（Hunk FAILED），
      # 且 5.15.198 中 .set_clock 仍引用 sdhci_msm_set_clock（非死代码），
      # 因此直接删除该补丁，保留内核原生时钟处理函数即可正常编译。
      # 仅 ipq40xx 存在此文件，rm -f 对其它架构为无操作。
      - name: 移除过时的 ipq40xx 内核补丁 401
        run: rm -f openwrt/target/linux/ipq40xx/patches-5.15/401-mmc-sdhci-msm-comment-unused-sdhci_msm_set_clock.patch

      # ---------------------------------------------------------------------
      # 缓存 1：dl 源码包（所有机型/架构共享，架构无关，最大提速收益）
      # 固定 key 让跨运行、跨机型都能复用；并发写入由 GitHub 自动处理（后者 skip）
      # ---------------------------------------------------------------------
      - name: 缓存 dl 目录（源码包）
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl
          restore-keys: |
            openwrt-dl

      # ---------------------------------------------------------------------
      # 缓存 2：ccache 编译缓存（按架构共享，同架构机型复用工具链与公共包）
      # ---------------------------------------------------------------------
      - name: 缓存 ccache（按架构）
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir/cache
          key: openwrt-ccache-${{ matrix.arch }}
          restore-keys: |
            openwrt-ccache-${{ matrix.arch }}

      - name: 执行 DIY-P1（添加自定义源）
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch || env.REPO_BRANCH }}
          # 机型名（如 a3004ns-dual.config）：diy-part1 据此对 16MB 小闪存机型
          # pin helloworld 到 a201839（luci 保持 reality 完整），xray 随后前移到 v1.8.24；大闪存机型仍走 master 最新
          TARGET_CONFIG: ${{ matrix.config }}
        run: |
          cd openwrt
          chmod +x ../$DIY_P1_SH
          ../$DIY_P1_SH

      - name: 更新并安装 feeds
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch || env.REPO_BRANCH }}
          # 机型名：diy-golang 据此选 Go 大版本（16MB 机型用 22.x 编 xray v1.8.24，其余 26.x）
          TARGET_CONFIG: ${{ matrix.config }}
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # 升级 Golang 工具链（见 diy-golang.sh）：18.06-k5.4 / 23.05 / master 均升 Go 1.26
          #   （helloworld master 最新 xray-core v26.5.9 的 go.mod 要求 go 1.26，自带 golang 编不过）。
          # 必须在 feeds update 之后（feeds/packages/ 此时才展开）、install 之前（确保装的是新版 golang）
          chmod +x ../$DIY_GOLANG_SH
          bash ../$DIY_GOLANG_SH
          ./scripts/feeds install -a

      - name: 执行 DIY-P2（修改默认设置）
        env:
          # 机型名：diy-part2 据此决定是否注入硬件 offload 的 uci-defaults / 防火墙默认项
          TARGET_CONFIG: ${{ matrix.config }}
        run: |
          cd openwrt
          chmod +x ../$DIY_P2_SH
          bash ../$DIY_P2_SH

      - name: 诊断 ssr-plus 来源（确认 helloworld 版生效）
        run: |
          cd openwrt
          echo "==> package/helloworld 是否存在："
          ls -d package/helloworld/luci-app-ssr-plus 2>/dev/null && echo "OK: helloworld 版已就位" || echo "!! package/helloworld 下无 luci-app-ssr-plus"
          echo "==> feeds/luci 官方版软链（若存在说明 fallback 到了官方版）："
          ls -la package/feeds/luci/luci-app-ssr-plus 2>/dev/null || echo "（无 feeds/luci 官方版软链，符合预期）"
          echo "==> 最终 menuconfig 识别到的 luci-app-ssr-plus 源目录："
          find package -type d -name luci-app-ssr-plus 2>/dev/null | head -5

      - name: 加载 ${{ matrix.config }}（源自 ${{ matrix.cfgdir }}）并生成默认配置
        run: |
          set -o pipefail   # make | tee 后仍能感知 make 的失败退出码
          cd openwrt
          cp ../${{ matrix.cfgdir }}/${{ matrix.config }} .config
          echo 'CONFIG_CCACHE=y' >> .config   # 启用 ccache，配合上面的 ccache 缓存
          # defconfig 的 kconfig 报 recursive dependency 时**退出码通常是 0**，
          # 但会静默丢弃整个 symbol（2026-11-01 事故：luci-app-ssr-plus 连同 19 个包全丢，
          # 镜像变小、体积检查反而报 OK）。这里把日志落盘并当场判死，10 分钟内失败。
          make defconfig 2>&1 | tee /tmp/defconfig.log
          if grep -q 'recursive dependency detected' /tmp/defconfig.log; then
            echo "!! 失败：kconfig 检出循环依赖，部分 symbol 已被静默丢弃（构建产物会缺包）"
            grep -A 6 'recursive dependency detected' /tmp/defconfig.log || true
            echo "   已知环：ssr-plus -> coreutils <- vssr -> iptables <- ssr-plus"
            echo "   已实测：删掉 ssr-plus 的 +coreutils 无效（run 41288545484 复现同环），"
            echo "   正确做法是让 ssr-plus 依赖保持上游原样，见 scripts/diy-part2.sh 第 [20] 段 ①"
            exit 1
          fi

      - name: 强制剔除默认全家桶/无无线/USB 链（defconfig 之后固化）
        env:
          # 机型名：diy-strip 据此对 16MB 机型追加剔除整个无线子系统 + 整条 USB 链
          TARGET_CONFIG: ${{ matrix.config }}
        run: |
          cd openwrt
          chmod +x ../scripts/diy-strip.sh
          bash ../scripts/diy-strip.sh

      - name: 配置一致性校验（kconfig 解析，防剔除项被依赖/select 拉回）
        env:
          TARGET_CONFIG: ${{ matrix.config }}
        run: |
          cd openwrt
          # 背景：2026-10-31 的构建里，diy-strip 跑完复核显示「USB 链全部未选中」，
          # 但 52 分钟后 package/kernel/linux 打包时却报
          #   Package kmod-usb-net is missing dependencies ... mii.ko
          # 说明 make 阶段读到的 .config 与裁剪后的 .config 不一致（配置被重新解析/拉回）。
          # 这里用 kconfig 自己解析一遍（与 make 的 out-of-sync 检查同一手法），
          # 把偏差直接打出来；有偏差就立刻失败，避免再白烧一小时。
          echo "==> 先让 tmp 索引与 scripts/config/conf 就绪（此前 conf 是 make 时才编出来的）"
          make prepare-tmpinfo >/dev/null 2>&1 || true

          echo "==> 索引就绪后再跑一次裁剪（幂等，且此时才能稳定压住 default y）"
          bash ../scripts/diy-strip.sh || exit 1

          echo "==> 用 kconfig 解析 .config，检查剔除项是否被拉回"
          cp .config /tmp/resolved.config
          ./scripts/config/conf --defconfig=/tmp/resolved.config -w /tmp/resolved.config Config.in >/dev/null 2>&1 || true

          echo "--- make 会看到的偏差（左侧 .config，右侧 kconfig 解析结果）---"
          ./scripts/kconfig.pl '>' .config /tmp/resolved.config > /tmp/kdiff.txt 2>/dev/null || true
          head -80 /tmp/kdiff.txt

          # ---- 校验 0：任何被 kconfig 拉回 =y 的包，都是潜在 Error 255 ----
          # 这是最通用的判据：只要解析结果里出现 .config 明写 =n、却被求解成 y/m 的包，
          # 说明该包被上层硬依赖（DEPENDS/select），而打包阶段却按 .config 不产出它的 ipk，
          # 最终必然在 package/install 阶段以 "cannot find dependency ..." 收场。
          # run 111661978562 就是这样：libiwinfo-lua 被 luci 硬依赖，我们却强制 =n。
          # 只认「.config 明写 =n 且解析为 y/m」这一种组合，避免误伤 select 产生的良性偏差。
          PULLED=""
          while read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y|CONFIG_PACKAGE_*=m) ;;
              *) continue ;;
            esac
            p=${line#CONFIG_PACKAGE_}
            p=${p%=*}
            if grep -qE "^CONFIG_PACKAGE_${p}=n$|^# CONFIG_PACKAGE_${p} is not set$" .config; then
              PULLED="$PULLED $line"
            fi
          done < /tmp/kdiff.txt
          if [ -n "$PULLED" ]; then
            echo "!! 失败：下列包在 .config 里是 =n，却被依赖求解强制拉成 y/m（打包阶段会缺 ipk）："
            for l in $PULLED; do echo "   $l"; done
            echo "!! 处理：把这些符号从 config-*.config 的 =n 列表与 diy-strip 的 FORCE_OFF 中移除。"
            echo "!!       （若确实要剔除，需先去掉硬依赖它的上层包。）"
            exit 1
          fi
          echo "OK：解析结果没有把任何包翻回 =y/m"

          # ---- 校验 A：diy-strip 导出的剔除清单，逐项确认没被 kconfig 翻回 =y ----
          # 背景：run 111661978562 的失败正是这一类。我们把 libiwinfo / libiwinfo-lua
          # 强制 =n（它们看着像"无线包"），但 luci 元包 LUCI_DEPENDS 里写死了
          # +libiwinfo-lua → kconfig 求解把它翻回 =y → 打包阶段按 .config 的 =n 不产出
          # 该 ipk → package/install 阶段 opkg 报
          #   "cannot find dependency libiwinfo-lua for luci" → Error 255。
          # 当时的旧检查只覆盖 kmod-usb*/mt76*/wpad，所以直接放行了。
          # 现在改为：以 diy-strip 实际导出的清单为唯一真相，一个都不漏。
          LIST=/tmp/force-off.list
          if [ -s "$LIST" ]; then
            BAD_OFF=""
            while read -r p; do
              [ -n "$p" ] || continue
              if grep -qE "^CONFIG_PACKAGE_${p}=(y|m)$" /tmp/resolved.config; then
                BAD_OFF="$BAD_OFF $p"
              fi
            done < "$LIST"
            if [ -n "$BAD_OFF" ]; then
              echo "!! 失败：以下被强制 =n 的包，被 kconfig 依赖求解翻回 y/m："
              for p in $BAD_OFF; do
                echo "   CONFIG_PACKAGE_${p}=y   ← 有包硬依赖它（DEPENDS/select），无法剔除"
              done
              echo "!! 处理：从 scripts/diy-strip.sh 的 FORCE_OFF 里移除上述符号；"
              echo "!!       若确需剔除，得先去掉依赖它的上层包（如 luci 元包→libiwinfo-lua）。"
              exit 1
            fi
            echo "OK：剔除清单 $(grep -c . "$LIST") 项在 kconfig 解析后均未被翻回"
          else
            echo "!! 警告：未找到 $LIST，跳过清单校验（diy-strip 可能未走到导出步骤）"
          fi

          # ---- 校验 B：已知高危符号的兜底（防清单本身漏项）----
          # 注意：kmod-mii 是刻意置 y 的依赖自洽补丁，不在检查范围内
          # 按机型分叉：a3004ns 是纯有线（无线必须全灭）；k2p 要开源无线（必须齐备）。
          CFG="${{ matrix.config }}"
          if echo "$CFG" | grep -qE '^a3004ns-dual\.config$'; then
            BAD=$(grep -E '^CONFIG_PACKAGE_(kmod-usb[^=]*|kmod-mt76[a-z0-9]*|kmod-mac80211|kmod-cfg80211|wpad[a-z0-9_.-]*)=(y|m)$' /tmp/resolved.config || true)
            if [ -n "$BAD" ]; then
              echo "!! 失败：以下被剔除的包在 kconfig 解析后又出现了（说明有包 select / DEVICE_PACKAGES 拉回）："
              echo "$BAD"
              echo "!! 请据此定位拉回源头（多为 mt7621.mk 的 DEVICE_PACKAGES 或某个包的 select）"
              exit 1
            fi
          fi

          if echo "$CFG" | grep -qE '^k2p\.config$'; then
            # K2P 反向校验：开源 mt7615e 全家必须在，且闭源 mt_wifi 必须不在。
            # 少了任一 kmod，固件会「能开机、没 wifi」—— 只有当 kconfig 解析结果
            # （make 真正看到的视图）里都在，才说明 DEVICE_PACKAGES 改对了。
            MISS=""
            # 只校验“菜单里可选”的包（mt76-core / mt76-connac / mt7615-common 是
            # HIDDEN:=1，由上层依赖自动 select，不能也不该在 .config 里硬写 =y；
            # 它们是否真的 y，等内核 .config 里的 CONFIG_MT7615E 一并看）
            for p in kmod-mt7615e kmod-mt7615-firmware kmod-mac80211 kmod-cfg80211 wpad-basic; do
              grep -qE "^CONFIG_PACKAGE_${p}=y$" /tmp/resolved.config || MISS="$MISS $p"
            done
            if [ -n "$MISS" ]; then
              echo "!! 失败：以下开源无线包在 kconfig 解析后不是 y："
              for p in $MISS; do echo "   CONFIG_PACKAGE_${p}"; done
              echo "!! 排查：DEVICE_PACKAGES 是否已由 diy-part2 第 [18] 段改成 kmod-mt7615e？"
              echo "         config 里是否误写成 kmod-mt7615e=n？"
              exit 1
            fi
            echo "   隐藏依赖链（由 select 自动拉入，仅供参考）："
            grep -E '^CONFIG_PACKAGE_(kmod-mt76-core|kmod-mt76-connac|kmod-mt7615-common)=' /tmp/resolved.config || true
            BADC=$(grep -E '^CONFIG_PACKAGE_(kmod-mt7615d|luci-app-mtwifi)=(y|m)$' /tmp/resolved.config || true)
            if [ -n "$BADC" ]; then
              echo "!! 失败：闭源 mt_wifi 驱动仍被选中（会与开源 mt7615e 抢同一张 PCI 卡，且多占 ~0.85MB）："
              echo "$BADC"
              exit 1
            fi
            echo "OK：K2P 开源无线栈齐备且无闭源驱动"
          fi

          if echo "$CFG" | grep -qE '^wr1200js\.config$'; then
            # WR1200JS 反向校验：开源 mt7603 + mt76x2 必须在，mt7615 全家必须不在。
            # 本机是 MT7603E(2.4G) + MT7612E(5G) 两颗独立芯片，DTS 走 pcie0/pcie1，
            # 上游 DEVICE_PACKAGES 就是开源的，所以这里只验「在不在」，不涉及换驱动。
            # 少了任一 kmod 的后果与 K2P 一样：能开机、没 wifi，且编译不报错。
            MISS=""
            for p in kmod-mt7603 kmod-mt76x2 kmod-mac80211 kmod-cfg80211 wpad-basic; do
              grep -qE "^CONFIG_PACKAGE_${p}=y$" /tmp/resolved.config || MISS="$MISS $p"
            done
            if [ -n "$MISS" ]; then
              echo "!! 失败：以下开源无线包在 kconfig 解析后不是 y："
              for p in $MISS; do echo "   CONFIG_PACKAGE_${p}"; done
              echo "!! 排查：config 里是否误写 =n；mt7621.mk 的 DEVICE_PACKAGES 是否被 diy-part2 第 [6/7/8] 段误剔"
              exit 1
            fi
            echo "   隐藏依赖链（由 select 自动拉入，仅供参考）："
            grep -E '^CONFIG_PACKAGE_(kmod-mt76-core|kmod-mt76x2-common|kmod-mt76)=' /tmp/resolved.config || true
            BADM=$(grep -E '^CONFIG_PACKAGE_(kmod-mt7615e|kmod-mt7615-firmware|kmod-mt7615d|luci-app-mtwifi)=(y|m)$' /tmp/resolved.config || true)
            if [ -n "$BADM" ]; then
              echo "!! 失败：mt7615 相关包被选中（本机没有该芯片，多占约 1MB，且与 wpad-basic 抢 hostapd）："
              echo "$BADM"
              exit 1
            fi
            BADW=$(grep -E '^CONFIG_PACKAGE_(wpad-openssl|wpad-wolfssl|wpad|wpad-mini)=(y|m)$' /tmp/resolved.config || true)
            if [ -n "$BADW" ]; then
              echo "!! 失败：除 wpad-basic 之外还有别的 wpad 变体被选中（PROVIDES 冲突）："
              echo "$BADW"
              echo "!! 排查：target.mk 的 DEFAULT_PACKAGES += wpad-openssl 是否已被 diy-part2 第 [23] 段用 -wpad-openssl 排除"
              exit 1
            fi
            echo "OK：WR1200JS 开源双芯片齐备（mt7603 + mt76x2），无 mt7615 / 无多余 wpad"
          fi

          # ---- 校验 C：luci 硬依赖必须齐备（上次 Error 255 的直接原因）----
          for p in libiwinfo libiwinfo-lua libiwinfo-data; do
            if ! grep -qE "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "!! 失败：CONFIG_PACKAGE_${p} 不是 y —— luci 元包会因此装不上（opkg Error 255）"
              exit 1
            fi
          done
          echo "OK：libiwinfo 三件套齐备（luci 硬依赖已满足）"

          # ---- 校验 D：ss 客户端必须真的被选中 ----
          # 背景：ssr-plus 187-2 把 Shadowsocks Client 做成了 kconfig choice，
          #   默认值在 mipsel 上是 Libev_Client。config 里若误写 NONE_Client=y，
          #   ss-local/ss-redir 会静默消失 —— 编译不报错，刷进机器却发现 ss 节点起不来。
          #   这里用解析后的视图判一次，避免「能编、功能没了」这种最贵的失败。
          if echo "$CFG" | grep -qE '^(a3004ns-dual|k2p|wr1200js)\.config$'; then
            if ! grep -qE '^CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Libev_Client=y$' /tmp/resolved.config; then
              echo "!! 失败：Shadowsocks-libev 客户端未被选中（ss 协议将不可用）"
              echo "   排查：config 里是否残留 INCLUDE_Shadowsocks_NONE_Client=y（choice 互斥）"
              grep -E '^CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_' /tmp/resolved.config || true
              exit 1
            fi
            if grep -qE '^CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_NONE_Client=y$' /tmp/resolved.config; then
              echo "!! 失败：NONE_Client 与 Libev_Client 同时 =y —— choice 只能二选一，必然 out of sync"
              exit 1
            fi
            for p in shadowsocks-libev-ss-local shadowsocks-libev-ss-redir libsodium libev; do
              grep -qE "^CONFIG_PACKAGE_${p}=y$" /tmp/resolved.config \
                || echo "   (注意) CONFIG_PACKAGE_${p} 未出现 =y，若功能异常先查这里"
            done
            echo "OK：ss 客户端（libev）已选中，ss-local/ss-redir 依赖链完整"
          fi


          # ---- 校验 N-1：核心包必须被 kconfig 真正选中 ----
          # 2026-11-01：kconfig 遇 recursive dependency 会**静默丢弃** symbol，
          # .config 里连 `# ... is not set` 都不留一行，看上去一切正常。
          # 这里显式验证核心包存在，编译前就拦住，别白烧 48 分钟。
          for p in luci-app-ssr-plus xray-core; do
            if ! grep -qE "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "!! 失败：最终 .config 里没有 CONFIG_PACKAGE_${p}=y"
              echo "   九成是 kconfig 报 recursive dependency 把 symbol 丢了。"
              echo "   排查：搜上面的 'recursive dependency detected' 链条，"
              echo "   典型是 luci-app-ssr-plus → coreutils ← luci-app-vssr → iptables 环。"
              echo "   已实测：删 ssr-plus 的 +coreutils 反而**制造**了这个环（41283679493 / 41288545484）；"
              echo "   正解是让 ssr-plus 依赖保持上游原样，见 scripts/diy-part2.sh 第 [20] 段 ①。"
              exit 1
            fi
          done
          if echo "${{ matrix.config }}" | grep -qE '^(k2p|wr1200js)\.config$'; then
            for p in luci-app-ngrokc ngrokc; do
              grep -qE "^CONFIG_PACKAGE_${p}=y$" .config \
                || { echo "!! 失败：${{ matrix.config }} 期望 $p=y，最终 .config 里没有"; exit 1; }
            done
            echo "OK：核心包已选中（luci-app-ssr-plus / xray-core / luci-app-ngrokc / ngrokc）"
          fi

          # ---- 校验 N：squashfs 块大小（2026-11-01 新增的零功能代价瘦身项）----
          # k2p.config 里显式写了 CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024（默认是 256）。
          # 块越大 xz 压缩字典越大，镜像普遍小 3~8%。这里硬校验，防止 kconfig 把它
          # 回落到默认值而我们看不出来（体积检查只会看到镜像偏大，却不知原因）。
          BS=$(grep -E '^CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=' /tmp/resolved.config | cut -d= -f2)
          echo "==> squashfs 块大小（kconfig 解析结果）：${BS:-未设置→默认 256} KiB"
          if echo "${{ matrix.config }}" | grep -qE '^(k2p|wr1200js)\.config$'; then
            if [ "${BS:-}" != "1024" ]; then
              echo "!! 失败：${{ matrix.config }} 期望 CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024，实际 '${BS:-}'"
              exit 1
            fi
            echo "OK：${{ matrix.config }} 的 squashfs 块大小 = 1024 KiB（xz 字典更大，镜像更小）"
          fi

          echo "OK：剔除项在 kconfig 解析后仍未选中，.config 与 make 的视图一致"

      - name: 诊断：dump 实际生效配置与已选大包
        run: |
          cd openwrt
          echo "===== 实际 .config 中显式选中的包（带 =y/=m，排除 =n）====="
          grep -E '=y|=m' .config | grep -iE 'PACKAGE_' | sort
          echo
          echo "===== 体积粗排：编译后各 ipk 大小（若已编出 staging）====="
          # 若尚未编译，至少列出被选中且体积敏感的关键包
          echo "==> 检查 ath10k / ssr-plus 相关选中状态："
          grep -E 'kmod-ath10k|ath10k-firmware|luci-app-ssr-plus|chinadns|pdnsd|smartdns|ipt2socks|microsocks|PACKAGE_xray|PACKAGE_v2ray' .config

      - name: 下载依赖源码包（先下完再编译，降低超时风险；已缓存的包会自动跳过）
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          # ⚠️ 必须根据真实产物判断成败：之前用 `make ...; echo status=success`（分号）
          # 会让编译实际失败时仍标记 success，导致后续步骤空跑、Release 无固件却显示绿。
          # 这里改为：bin/targets 下存在任意 .bin/.img 才算成功，否则标记 failed 并 exit 1
          # （exit 1 让 job 变红，真实报错直接留在上方 make 日志里可见）。
          # rockchip 等平台的 SD 卡镜像扩展名为 .img.gz（其它平台为 .bin/.img），
          # 必须把 *.img.gz 也纳入判定，否则固件实际已生成却会被误判为失败
          if [ -n "$(find bin/targets -type f \( -name '*.bin' -o -name '*.img' -o -name '*.img.gz' \) 2>/dev/null | head -1)" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "!! 未生成任何固件镜像（bin/targets 下无 .bin/.img），编译实际失败"
            exit 1
          fi

      - name: 体积预算检查（16MB 小闪存机型）
        if: steps.compile.outputs.status == 'success'
        run: |
          # ── 硬件 offload 落地校验（本机型强制启用，缺一项就直接失败）──
          if echo "${{ matrix.config }}" | grep -qE '^(a3004ns-dual|k2p|wr1200js)\.config$'; then
            KC=$(ls -1 openwrt/build_dir/target-*/linux-*/linux-*/.config 2>/dev/null | head -1)
            if [ -n "$KC" ]; then
              echo "==> 内核 flowtable 符号（$KC）"
              grep -E '^CONFIG_NF_FLOW_TABLE(_HW)?=' "$KC" || echo "!! 未找到 NF_FLOW_TABLE 符号"
              if ! grep -qE '^CONFIG_NF_FLOW_TABLE_HW=[ym]' "$KC"; then
                echo "!! 失败：CONFIG_NF_FLOW_TABLE_HW 未置位 —— fw3 的 FLOWOFFLOAD --hw 不会生效"
                echo "   排查：确认 .config 里 CONFIG_PACKAGE_kmod-nf-flow=y（其 KCONFIG 带 NF_FLOW_TABLE_HW）"
                exit 1
              fi
              echo "OK：NF_FLOW_TABLE_HW 已编入，PPE 硬件卸载路径成立"
            else
              echo "!! 未找到内核 .config，跳过硬件 offload 符号校验"
            fi
            echo "==> 下发侧：image 默认 firewall 配置"
            grep -E 'flow_offloading' openwrt/package/network/config/firewall/files/firewall.config \
              || { echo "!! 失败：firewall.config 未带 flow_offloading 选项"; exit 1; }
            echo "==> 下发侧：首次启动补齐脚本"
            ls -l openwrt/files/etc/uci-defaults/99-a3004ns-hw-offload \
              || { echo "!! 失败：uci-defaults 未注入（diy-part2 第17段未执行？）"; exit 1; }
          fi

          cd openwrt/bin/targets/*/*
          # ── 包体积体检：只打印、不参与判定，给下一轮精准裁剪提供真实数据 ──
          #   ipk 是单包压缩包，和 squashfs 里的大小同量级但不相等（压缩算法不同）；
          #   用它排序找「谁最占地方」已经够用。
          if ls packages/*.ipk >/dev/null 2>&1; then
            echo "==> Top 30 大包（ipk 大小，降序）"
            ls -S packages/*.ipk 2>/dev/null | head -30 | while read -r f; do
              sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
              printf "  %7d KiB  %s\n" $((sz/1024)) "$(basename "$f")"
            done
            echo "==> 单包合计：$(ls -1 packages/*.ipk 2>/dev/null | wc -l) 个包，$(du -sk packages 2>/dev/null | cut -f1) KiB"
          fi
          # ── 核心功能包必须在 manifest 里（防「构建成功但功能整块丢失」的假成功）──
          # 2026-11-01 run 41283679493 事故：kconfig 报 recursive dependency
          #   （ssr-plus → coreutils ← vssr → iptables ← ssr-plus），求解失败后直接把
          #   PACKAGE_luci-app-ssr-plus 这个 symbol 丢掉 —— 前端 + curl + shadowsocks-libev
          #   + libsodium 等 19 个包全没进镜像。而体积检查只看到「镜像变小了 → OK」，
          #   属于最危险的假成功。此闸门专门拦这一种。
          MAN=$(ls -1 *.manifest 2>/dev/null | head -1)
          [ -z "$MAN" ] && { echo "!! 失败：未找到 manifest"; exit 1; }
          MISSING=""
          for p in luci-app-ssr-plus xray-core; do
            grep -q "^$p " "$MAN" || MISSING="$MISSING $p"
          done
          if echo "${{ matrix.config }}" | grep -qE '^(k2p|wr1200js)\.config$'; then
            for p in ngrokc luci-app-ngrokc; do
              grep -q "^$p " "$MAN" || MISSING="$MISSING $p"
            done
          fi
          if [ -n "$MISSING" ]; then
            echo "!! 失败：manifest 缺少核心包:$MISSING"
            echo "   构建虽然绿了，但功能缺失 = 假成功。先翻 defconfig 日志查"
            echo "   'recursive dependency detected' —— kconfig 丢弃 symbol 时不会有别的声音。"
            exit 1
          fi
          echo "OK：核心功能包齐全（luci-app-ssr-plus / xray-core / ngrokc 均在 manifest，共 $(wc -l < "$MAN") 包）"

          # ── WR1200JS：dropbear / opkg 必须不在 manifest（用户明确要求不要）──
          # 为什么单独验：这两个是 include/target.mk DEFAULT_PACKAGES 的硬编码项，
          # 正常情况下靠 diy-part2 第 [22] 段调用 patch-drop-opkg.py 从源码摘掉。
          # 一旦摘除没生效（脚本缺失 / 路径不对 / 被某个包 +dropbear 拉回），
          # 固件照样能启动，只是多占约 160KB 安装体积且「以为没有 SSH 其实有」，
          # 属于看不见的偏差，必须显式拦住。
          if echo "${{ matrix.config }}" | grep -qE '^wr1200js\.config$'; then
            BADD=""
            for p in dropbear opkg; do
              grep -q "^$p " "$MAN" && BADD="$BADD $p"
            done
            if [ -n "$BADD" ]; then
              echo "!! 失败：manifest 里仍有【${BADD# }】"
              echo "   排查：scripts/patch-drop-opkg.py 是否被 diy-part2 第 [22] 段调用成功"
              echo "         （日志里应有「已从 include/target.mk 的 DEFAULT_PACKAGES 摘除」）"
              exit 1
            fi
            echo "OK：manifest 中无 dropbear / opkg（按用户要求，只保留 LuCI 管理）"
          fi

          # 仅对 16MB SPI NOR 机型做硬校验：镜像必须小于 firmware 分区，
          # 且至少留 1MiB 给 overlay（配置/日志/opkg 都写在 overlay 上）。
          #   分区大小来自设备定义 IMAGE_SIZE：
          #     a3004ns-dual = 16128k（DTS: reg = <0x40000 0xfc0000>）
          #     phicomm_k2p  = 16064k（diy-part2 第19段覆盖 DTS 为 reg = <0x50000 0xfb0000>，
          #                            弃用原厂 permanent_config 换回 320k）
          if echo "${{ matrix.config }}" | grep -qE '^(a3004ns-dual|k2p|wr1200js)\.config$'; then
            SYS=$(ls -1 *squashfs-sysupgrade.bin 2>/dev/null | head -1)
            [ -z "$SYS" ] && { echo "!! 未找到 squashfs-sysupgrade 镜像"; exit 1; }
            SZ=$(stat -c%s "$SYS")
            if echo "${{ matrix.config }}" | grep -qE '^(k2p|wr1200js)\.config$'; then
              LIMIT=$((16064*1024)); LIMITK=16064
            else
              LIMIT=$((16128*1024)); LIMITK=16128
            fi
            LEFT=$(( (LIMIT-SZ)/1024 ))
            echo "镜像      : $SYS"
            echo "镜像大小  : $((SZ/1024)) KiB"
            echo "分区上限  : ${LIMITK} KiB"
            echo "剩余给overlay: ${LEFT} KiB"
            if [ "$SZ" -gt "$LIMIT" ]; then
              echo "!! 失败：镜像超过 firmware 分区，无法刷入。请回退 xray 版本或继续裁剪。"
              exit 1
            fi
            if [ "$LEFT" -lt 1024 ]; then
              echo "!! 警告：overlay 余量不足 1MiB，运行期大概率写满"
              echo "   注意：本机型已关闭整条 USB 链，extroot 不可用 —— 唯一出路是重编固件再裁剪。"
            else
              echo "OK：体积在预算内"
            fi
          fi

      - name: 整理固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 生成发布标签（按机型名区分）
        id: tag
        if: steps.compile.outputs.status == 'success'
        run: |
          device=$(echo "${{ matrix.config }}" | sed 's/\.config$//')
          echo "release_tag=${device}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: ${{ env.FIRMWARE }}/*

      - name: 上传 Artifact（编译失败时也可拿到半成品排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ matrix.config }}
          path: openwrt/bin/targets/**/*
          retention-days: 7
